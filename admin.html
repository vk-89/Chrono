<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Admin · Chrono</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --paper:#F4F3EC; --surface:#FFFFFF; --ink:#1C1E1B; --ink-soft:#63655D; --ink-faint:#9A9C92;
    --border:#E1DFD2; --border-strong:#CFCDBD;
    --study-h:208; --study-s:62%; --social-h:16; --social-s:72%; --essential-h:150; --essential-s:32%;
    --danger:#B3492F; --accent:#B3492F; --radius:14px; --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;}
  h1,h2,h3{font-family:"Space Grotesk",sans-serif;margin:0;}
  button{font-family:inherit;cursor:pointer;}
  button:disabled{opacity:0.6;cursor:not-allowed;}
  input,select,textarea{font-family:inherit;}
  .hidden{display:none!important;}

  /* ---- Login ---- */
  #loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;width:100%;max-width:360px;}
  .login-card h1{font-size:20px;margin-bottom:4px;}
  .login-card p{color:var(--ink-soft);font-size:13px;margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .field input,.field select,.field textarea{width:100%;background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;color:var(--ink);}
  .field textarea{resize:vertical;min-height:80px;line-height:1.4;}
  .btn{border:none;border-radius:999px;padding:11px 16px;font-size:13.5px;font-weight:600;font-family:"Space Grotesk";width:100%;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-ghost{background:var(--paper);color:var(--ink-soft);border:1px solid var(--border);}
  .btn-danger{background:none;color:var(--danger);border:1px solid var(--danger);}

  /* ---- Shell ---- */
  #adminApp{max-width:920px;margin:0 auto;padding:16px 16px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 24px;}
  .topbar h1{font-size:18px;}
  .topbar .sub{font-size:11.5px;color:var(--ink-soft);}
  .icon-btn{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--ink-soft);font-weight:600;}

  /* ---- Users list ---- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .card h2{font-size:14px;margin-bottom:2px;}
  .card .hint{font-size:12px;color:var(--ink-soft);margin:4px 0 14px;}
  .search-input{width:100%;background:var(--paper);border:1px solid var(--border);border-radius:999px;padding:10px 14px;font-size:13.5px;margin-bottom:12px;}
  .user-row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--border);}
  .user-row:last-child{border-bottom:none;}
  .user-av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none;}
  .user-info{flex:1;min-width:0;}
  .user-email{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .user-meta{font-size:11.5px;color:var(--ink-soft);}

  /* ---- Modals ---- */
  .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(28,30,27,0.45);z-index:100;align-items:flex-end;justify-content:center;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 18px 26px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;position:relative;}
  @media(min-width:520px){.modal-backdrop{align-items:center;}.modal{border-radius:var(--radius);}}
  .modal-close{position:absolute;top:16px;right:16px;background:var(--paper);border:none;width:30px;height:30px;border-radius:50%;font-size:14px;color:var(--ink-soft);z-index:10;}
</style>
</head>
<body>

<div id="loginView">
  <div class="login-card">
    <h1>Admin · Chrono</h1>
    <p id="loginSub">Sign in with your admin account to continue.</p>
    <div class="field"><label>Email</label><input type="email" id="loginEmail" autocomplete="username"></div>
    <div class="field"><label>Password</label><input type="password" id="loginPassword" autocomplete="current-password"></div>
    <button class="btn btn-primary" id="loginBtn">Sign in</button>
    <div class="auth-msg" id="loginMsg"></div>
  </div>
</div>

<div id="adminApp" class="hidden">
  <div class="topbar">
    <div>
      <h1>Admin · Chrono</h1>
      <div class="sub" id="adminWhoami"></div>
    </div>
    <button class="icon-btn" id="signOutBtn">Sign out</button>
  </div>

  <div id="usersTab">
    <div class="card">
      <h2>User Directory</h2>
      <div class="hint">Click a user to view their account details.</div>
      <input type="text" class="search-input" id="userSearch" placeholder="Search by email or UID...">
      <div id="usersList"><div class="loading-note">Loading users…</div></div>
    </div>
  </div>
</div>

<!-- User Detail Modal -->
<div class="modal-backdrop" id="userModal">
  <div class="modal">
    <button class="modal-close" data-close="userModal">✕</button>
    <div id="userModalBody">
      <div class="loading-note">Loading user data...</div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

const firebaseConfig = {
  apiKey: "AIzaSyBkqINVQDvotNAlwezK6_fXhHduT7E2M_4",
  authDomain: "chrono-e6497.firebaseapp.com",
  projectId: "chrono-e6497",
  storageBucket: "chrono-e6497.firebasestorage.app",
  messagingSenderId: "954295376775",
  appId: "1:954295376775:web:5383634ba4a04e61289122"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '—'; const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleString(); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function openModal(id){ document.getElementById(id).classList.add('open'); }
document.querySelectorAll('[data-close]').forEach(btn=>{
  btn.addEventListener('click', ()=> closeModal(btn.getAttribute('data-close')));
});

/* ============================= AUTH ============================= */
const loginMsg = document.getElementById('loginMsg');
document.getElementById('loginBtn').addEventListener('click', async ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  loginMsg.textContent = '';
  try{
    await auth.signInWithEmailAndPassword(email, password);
  } catch(err){
    loginMsg.textContent = err.message;
  }
});

document.getElementById('signOutBtn').addEventListener('click', ()=> auth.signOut());

auth.onAuthStateChanged(async user => {
  if (user && user.email) {
    try {
      const adminDoc = await db.collection('admins').doc(user.email.toLowerCase()).get();
      if (adminDoc.exists) {
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('adminApp').classList.remove('hidden');
        document.getElementById('adminWhoami').textContent = user.email;
        loadUsers();
        return;
      }
    } catch (err) {}
    loginMsg.textContent = 'Unauthorized admin account.';
    auth.signOut();
  } else {
    document.getElementById('loginView').classList.remove('hidden');
    document.getElementById('adminApp').classList.add('hidden');
  }
});

/* ============================= USER DIRECTORY ============================= */
let allUsers = [];

async function loadUsers(){
  try{
    const usersSnap = await db.collection('users').get();
    allUsers = usersSnap.docs.map(d => ({ uid: d.id, ...d.data() }));
    allUsers.sort((a,b) => new Date(b.lastLogin||0) - new Date(a.lastLogin||0));
    renderUsers(allUsers);
  } catch(err){ console.error(err); }
}

function renderUsers(list){
  const el = document.getElementById('usersList');
  if(!list.length){ el.innerHTML = '<div class="empty-note">No users found.</div>'; return; }
  el.innerHTML = list.map(u => `
    <div class="user-row" style="cursor:pointer;" onclick="window.viewUser('${u.uid}')">
      <div class="user-av">${escapeHtml((u.email||'U').slice(0,1).toUpperCase())}</div>
      <div class="user-info">
        <div class="user-email">${escapeHtml(u.email || u.uid)}</div>
        <div class="user-meta">Last seen ${fmtDate(u.lastLogin)}</div>
      </div>
    </div>
  `).join('');
}

document.getElementById('userSearch').addEventListener('input', (e)=>{
  const q = e.target.value.toLowerCase();
  renderUsers(allUsers.filter(u => (u.email||'').toLowerCase().includes(q) || u.uid.toLowerCase().includes(q)));
});

/* ============================= USER DETAIL VIEW ============================= */
window.viewUser = async function(uid){
  openModal('userModal');
  const body = document.getElementById('userModalBody');
  body.innerHTML = '<div class="loading-note">Loading user details...</div>';

  try {
    const snap = await db.collection('users').doc(uid).get();
    const u = snap.data() || {};
    body.innerHTML = `
      <h2 style="margin-bottom:16px;">User Details</h2>
      <div class="field">
        <label>User ID</label>
        <input type="text" value="${escapeHtml(uid)}" readonly>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="text" value="${escapeHtml(u.email || '')}" readonly>
      </div>
      <div class="field">
        <label>Last Login</label>
        <input type="text" value="${fmtDate(u.lastLogin)}" readonly>
      </div>
      <div class="field">
        <label>Created At</label>
        <input type="text" value="${fmtDate(u.createdAt)}" readonly>
      </div>
    `;
  } catch(err) {
    body.innerHTML = '<div class="empty-note">Error loading user data.</div>';
    console.error(err);
  }
};

})();
</script>
</body>
</html>
