<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F3EC">
<title>Sign In — Chrono</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<!-- Firebase v10 SDK (Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<style>
  :root {
    --paper: #F4F3EC;
    --ink: #1C1E1B;
    --ink-soft: #63655D;
    --border: #E1DFD2;
    --border-strong: #CFCDBD;
    --dawn: #E87A5D;
    --gold: #F5BD4F;
    --dusk: #63768D;
    --danger: #B3492F;
    --radius: 18px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    overflow: hidden;
  }

  .container {
    width: 100%;
    max-width: 360px;
    padding: 24px;
    text-align: center;
    position: relative;
    z-index: 10;
  }

  /* ---- Day Arc SVG ---- */
  .arc-container {
    width: 180px;
    height: 100px;
    margin: 0 auto 20px;
    position: relative;
  }
  .arc-svg { width: 100%; height: 100%; }
  .arc-track {
    fill: none;
    stroke: var(--border-strong);
    stroke-width: 2.5;
    stroke-linecap: round;
  }
  .arc-progress {
    fill: none;
    stroke: url(#arcGradient);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 200;
    stroke-dashoffset: 200;
    transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .now-dot {
    fill: var(--gold);
    filter: drop-shadow(0 0 4px var(--gold));
  }
  .now-dot-halo {
    fill: var(--gold);
    opacity: 0.15;
  }

  .wordmark {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 32px;
    letter-spacing: -0.03em;
    margin: 0 0 8px;
  }
  .tagline {
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 40px;
    line-height: 1.4;
  }

  /* ---- Auth Steps ---- */
  .step { display: none; animation: fadeIn 0.4s ease forwards; }
  .step.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .field-group { margin-bottom: 20px; text-align: left; }
  .label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  
  .field-input {
    width: 100%;
    background: #FFFFFF;
    border: 1.5px solid var(--border-strong);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 17px;
    color: var(--ink);
    font-family: inherit;
    transition: border-color 0.2s;
  }
  .field-input:focus {
    outline: none;
    border-color: var(--ink);
  }

  .otp-container {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 24px;
  }
  .otp-box {
    width: 100%;
    aspect-ratio: 1;
    background: #FFFFFF;
    border: 1.5px solid var(--border-strong);
    border-radius: 10px;
    text-align: center;
    font-size: 20px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    color: var(--ink);
    padding: 0;
  }
  .otp-box:focus {
    outline: none;
    border-color: var(--ink);
    background: #FFFFFF;
  }

  .btn-primary {
    width: 100%;
    background: var(--dawn);
    color: #1A0E08;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-ghost {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 14px;
    margin-top: 16px;
    cursor: pointer;
    text-decoration: underline;
  }

  .error-banner {
    background: #FFF5F5;
    color: var(--danger);
    border: 1px solid rgba(179, 73, 47, 0.15);
    padding: 12px;
    border-radius: 10px;
    font-size: 13px;
    margin-top: 20px;
    display: none;
    line-height: 1.4;
  }

  #recaptcha-container { margin-top: 15px; }

  /* Utilities */
  .mt-4 { margin-top: 16px; }
  .row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .row:hover { background: rgba(28, 30, 27, 0.04); }
</style>
</head>
<body>

<div class="container">
  <div class="arc-container">
    <svg class="arc-svg" viewBox="0 0 100 55">
      <defs>
        <linearGradient id="arcGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="var(--dawn)" />
          <stop offset="50%" stop-color="var(--gold)" />
          <stop offset="100%" stop-color="var(--dusk)" />
        </linearGradient>
      </defs>
      <path class="arc-track" d="M 10 45 A 40 40 0 0 1 90 45" />
      <path id="progressPath" class="arc-progress" d="M 10 45 A 40 40 0 0 1 90 45" />
      <circle id="nowHalo" class="now-dot-halo" r="3" />
      <circle id="nowDot" class="now-dot" r="1.5" />
    </svg>
  </div>

  <h1 class="wordmark">Chrono</h1>
  <p class="tagline" id="tagline">Sign in to sync your routines and access personalized insights.</p>

  <!-- Step 1: Phone -->
  <div id="step-phone" class="step active">
    <div class="field-group">
      <label class="label">Phone Number</label>
      <input type="tel" id="phoneNumber" class="field-input" placeholder="+91 98765 43210" autocomplete="tel">
    </div>
    <div id="recaptcha-container"></div>
    <button id="send-code-btn" class="btn-primary mt-4">Send Verification Code</button>
  </div>

  <!-- Step 2: OTP -->
  <div id="step-otp" class="step">
    <div class="field-group">
      <label class="label">Verification Code</label>
      <div class="otp-container">
        <input type="number" class="otp-box" maxlength="1" pattern="\d*">
        <input type="number" class="otp-box" maxlength="1" pattern="\d*">
        <input type="number" class="otp-box" maxlength="1" pattern="\d*">
        <input type="number" class="otp-box" maxlength="1" pattern="\d*">
        <input type="number" class="otp-box" maxlength="1" pattern="\d*">
        <input type="number" class="otp-box" maxlength="1" pattern="\d*">
      </div>
    </div>
    <button id="verify-code-btn" class="btn-primary">Verify & Sign In</button>
    <button id="resend-btn" class="btn-ghost">Didn't get a code? Try again</button>
  </div>

  <div id="error-message" class="error-banner"></div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBkqINVQDvotNAlwezK6_fXhHduT7E2M_4",
    authDomain: "chrono-e6497.firebaseapp.com",
    projectId: "chrono-e6497",
    storageBucket: "chrono-e6497.firebasestorage.app",
    messagingSenderId: "954295376775",
    appId: "1:954295376775:web:5383634ba4a04e61289122"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  let confirmationResult = null;

  function showError(msg) {
    const err = document.getElementById('error-message');
    err.textContent = msg;
    err.style.display = msg ? 'block' : 'none';
  }

  // --- Arc Logic ---
  function updateArc() {
    const now = new Date();
    const hours = now.getHours() + now.getMinutes() / 60;
    // Map 0-24h to 0.0-1.0 progress on the arc
    // However, the arc visually represents a day, let's say 6am to 10pm usually
    // For simplicity, let's just map 24 hours to the full arc length
    const progress = hours / 24;
    
    const path = document.getElementById('progressPath');
    const dot = document.getElementById('nowDot');
    const halo = document.getElementById('nowHalo');
    const totalLength = path.getTotalLength();
    
    path.style.strokeDashoffset = totalLength - (totalLength * progress);
    
    const point = path.getPointAtLength(totalLength * progress);
    dot.setAttribute('cx', point.x);
    dot.setAttribute('cy', point.y);
    halo.setAttribute('cx', point.x);
    halo.setAttribute('cy', point.y);
  }
  
  setInterval(updateArc, 60000);
  updateArc();

  // --- Auth Flow ---
  window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
    'size': 'normal',
    'callback': (response) => {
      document.getElementById('send-code-btn').disabled = false;
    }
  });

  async function onSendCode() {
    const phone = document.getElementById('phoneNumber').value.trim();
    if (!phone) return showError("Please enter a valid phone number.");
    
    showError("");
    const btn = document.getElementById('send-code-btn');
    btn.disabled = true;
    btn.textContent = "Sending...";

    try {
      const appVerifier = window.recaptchaVerifier;
      confirmationResult = await auth.signInWithPhoneNumber(phone, appVerifier);
      
      document.getElementById('step-phone').classList.remove('active');
      document.getElementById('step-otp').classList.add('active');
      document.getElementById('tagline').textContent = "We've sent a 6-digit code to " + phone;
      
      // Focus first OTP box
      document.querySelector('.otp-box').focus();
    } catch (err) {
      console.error(err);
      showError(err.message || "Failed to send code. Please check the number.");
      btn.disabled = false;
      btn.textContent = "Send Verification Code";
      window.recaptchaVerifier.render().then(id => grecaptcha.reset(id));
    }
  }

  async function onVerifyCode() {
    const boxes = document.querySelectorAll('.otp-box');
    const code = Array.from(boxes).map(b => b.value).join('');
    
    if (code.length !== 6) return showError("Enter the 6-digit code.");
    
    showError("");
    const btn = document.getElementById('verify-code-btn');
    btn.disabled = true;
    btn.textContent = "Verifying...";

    try {
      await confirmationResult.confirm(code);
      window.location.href = "index.html";
    } catch (err) {
      showError("Invalid code. Please try again.");
      btn.disabled = false;
      btn.textContent = "Verify & Sign In";
    }
  }

  document.getElementById('send-code-btn').addEventListener('click', onSendCode);
  document.getElementById('verify-code-btn').addEventListener('click', onVerifyCode);
  document.getElementById('resend-btn').addEventListener('click', () => {
    document.getElementById('step-otp').classList.remove('active');
    document.getElementById('step-phone').classList.add('active');
    document.getElementById('tagline').textContent = "Sign in to sync your routines and access personalized insights.";
    showError("");
  });

  // OTP box auto-focus behavior
  const otpBoxes = document.querySelectorAll('.otp-box');
  otpBoxes.forEach((box, idx) => {
    box.addEventListener('input', (e) => {
      if (box.value.length === 1 && idx < otpBoxes.length - 1) {
        otpBoxes[idx + 1].focus();
      }
    });
    box.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !box.value && idx > 0) {
        otpBoxes[idx - 1].focus();
      }
      if (e.key === 'Enter' && idx === otpBoxes.length - 1) {
        onVerifyCode();
      }
    });
  });

  auth.onAuthStateChanged(user => {
    if (user) window.location.href = "index.html";
  });
</script>
</body>
</html>
