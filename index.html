<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F3EC">
<title>Chrono</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

<!-- Firebase v10 SDK (Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
  :root {
    --paper: #F4F3EC;
    --ink: #1C1E1B;
    --ink-soft: #63655D;
    --border: #E1DFD2;
    --border-strong: #CFCDBD;
    --dawn: #E87A5D;
    --gold: #F5BD4F;
    --dusk: #63768D;
    --danger: #B3492F;
    --accent: #E87A5D;
    --radius: 18px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
  }

  .admin-banner {
    background: var(--accent);
    color: white;
    text-align: center;
    padding: 8px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
    position: sticky;
    top: 0;
    z-index: 1000;
    display: none;
  }
  body.read-only .admin-banner { display: block; }
  body.read-only .admin-disabled { 
    opacity: 0.6 !important; 
    pointer-events: none !important; 
    cursor: not-allowed !important;
  }

  .container {
    width: 100%;
    max-width: 360px;
    padding: 24px;
    text-align: center;
    position: relative;
    z-index: 10;
    margin: 0 auto;
  }

  .arc-container {
    width: 180px;
    height: 100px;
    margin: 0 auto 20px;
    position: relative;
  }
  .arc-svg { width: 100%; height: 100%; }
  .arc-track {
    fill: none;
    stroke: var(--border-strong);
    stroke-width: 2.5;
    stroke-linecap: round;
  }
  .arc-progress {
    fill: none;
    stroke: url(#arcGradient);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 200;
    stroke-dashoffset: 200;
    transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .now-dot {
    fill: var(--gold);
    filter: drop-shadow(0 0 4px var(--gold));
  }
  .now-dot-halo {
    fill: var(--gold);
    opacity: 0.15;
  }

  .wordmark {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 32px;
    letter-spacing: -0.03em;
    margin: 0 0 8px;
  }
  .tagline {
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 40px;
    line-height: 1.4;
  }

  .step { display: none; animation: fadeIn 0.4s ease forwards; }
  .step.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .field-group { margin-bottom: 20px; text-align: left; }
  .label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  
  .field-input {
    width: 100%;
    background: #FFFFFF;
    border: 1.5px solid var(--border-strong);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 17px;
    color: var(--ink);
    font-family: inherit;
    transition: border-color 0.2s;
  }
  .field-input:focus { outline: none; border-color: var(--ink); }

  .otp-container {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 24px;
  }
  .otp-box {
    width: 100%;
    aspect-ratio: 1;
    background: #FFFFFF;
    border: 1.5px solid var(--border-strong);
    border-radius: 10px;
    text-align: center;
    font-size: 20px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    color: var(--ink);
    padding: 0;
  }

  .btn-primary {
    width: 100%;
    background: var(--dawn);
    color: #1A0E08;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-ghost {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 14px;
    margin-top: 16px;
    cursor: pointer;
    text-decoration: underline;
  }

  .error-banner {
    background: #FFF5F5;
    color: var(--danger);
    border: 1px solid rgba(179, 73, 47, 0.15);
    padding: 12px;
    border-radius: 10px;
    font-size: 13px;
    margin-top: 20px;
    display: none;
    line-height: 1.4;
  }

  #recaptcha-container { margin-top: 15px; }
  .mt-4 { margin-top: 16px; }
</style>
</head>
<body>

<div class="admin-banner">Viewing as admin — read-only</div>

<div class="container" id="auth-ui">
  <div class="arc-container">
    <svg class="arc-svg" viewBox="0 0 100 55">
      <defs>
        <linearGradient id="arcGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="var(--dawn)" />
          <stop offset="50%" stop-color="var(--gold)" />
          <stop offset="100%" stop-color="var(--dusk)" />
        </linearGradient>
      </defs>
      <path class="arc-track" d="M 10 45 A 40 40 0 0 1 90 45" />
      <path id="progressPath" class="arc-progress" d="M 10 45 A 40 40 0 0 1 90 45" />
      <circle id="nowHalo" class="now-dot-halo" r="3" />
      <circle id="nowDot" class="now-dot" r="1.5" />
    </svg>
  </div>

  <h1 class="wordmark">Chrono</h1>
  <p class="tagline" id="tagline">Sign in to sync your routines and access personalized insights.</p>

  <div id="step-phone" class="step active">
    <div class="field-group">
      <label class="label">Phone Number</label>
      <input type="tel" id="phoneNumber" class="field-input" placeholder="+91 98765 43210" autocomplete="tel">
    </div>
    <div id="recaptcha-container"></div>
    <button id="send-code-btn" class="btn-primary mt-4">Send Verification Code</button>
  </div>

  <div id="step-otp" class="step">
    <div class="field-group">
      <label class="label">Verification Code</label>
      <div class="otp-container">
        <input type="number" class="otp-box" maxlength="1">
        <input type="number" class="otp-box" maxlength="1">
        <input type="number" class="otp-box" maxlength="1">
        <input type="number" class="otp-box" maxlength="1">
        <input type="number" class="otp-box" maxlength="1">
        <input type="number" class="otp-box" maxlength="1">
      </div>
    </div>
    <button id="verify-code-btn" class="btn-primary">Verify & Sign In</button>
    <button id="resend-btn" class="btn-ghost">Didn't get a code? Try again</button>
  </div>

  <div id="error-message" class="error-banner"></div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBkqINVQDvotNAlwezK6_fXhHduT7E2M_4",
    authDomain: "chrono-e6497.firebaseapp.com",
    projectId: "chrono-e6497",
    storageBucket: "chrono-e6497.firebasestorage.app",
    messagingSenderId: "954295376775",
    appId: "1:954295376775:web:5383634ba4a04e61289122"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const state = {
    user: null,
    viewAsUid: new URLSearchParams(window.location.search).get('viewAsUid'),
    readOnly: false,
    activities: [],
    events: [],
    savedNotes: []
  };

  function activeUid() {
    return state.viewAsUid || (state.user && state.user.uid);
  }

  function showError(msg) {
    const err = document.getElementById('error-message');
    if (err) {
      err.textContent = msg;
      err.style.display = msg ? 'block' : 'none';
    }
  }

  function updateArc() {
    const now = new Date();
    const hours = now.getHours() + now.getMinutes() / 60;
    const progress = hours / 24;
    const path = document.getElementById('progressPath');
    const dot = document.getElementById('nowDot');
    const halo = document.getElementById('nowHalo');
    if (!path || !dot || !halo) return;
    const totalLength = path.getTotalLength();
    path.style.strokeDashoffset = totalLength - (totalLength * progress);
    const point = path.getPointAtLength(totalLength * progress);
    dot.setAttribute('cx', point.x);
    dot.setAttribute('cy', point.y);
    halo.setAttribute('cx', point.x);
    halo.setAttribute('cy', point.y);
  }
  setInterval(updateArc, 60000);
  updateArc();

  window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
    'size': 'normal',
    'callback': () => { document.getElementById('send-code-btn').disabled = false; }
  });

  async function onSendCode() {
    const phone = document.getElementById('phoneNumber').value.trim();
    if (!phone) return showError("Please enter a valid phone number.");
    showError("");
    const btn = document.getElementById('send-code-btn');
    btn.disabled = true;
    btn.textContent = "Sending...";
    try {
      const appVerifier = window.recaptchaVerifier;
      window.confirmationResult = await auth.signInWithPhoneNumber(phone, appVerifier);
      document.getElementById('step-phone').classList.remove('active');
      document.getElementById('step-otp').classList.add('active');
      document.getElementById('tagline').textContent = "We've sent a 6-digit code to " + phone;
      document.querySelector('.otp-box').focus();
    } catch (err) {
      showError(err.message || "Failed to send code.");
      btn.disabled = false;
      btn.textContent = "Send Verification Code";
    }
  }

  async function onVerifyCode() {
    const boxes = document.querySelectorAll('.otp-box');
    const code = Array.from(boxes).map(b => b.value).join('');
    if (code.length !== 6) return showError("Enter the 6-digit code.");
    showError("");
    const btn = document.getElementById('verify-code-btn');
    btn.disabled = true;
    btn.textContent = "Verifying...";
    try {
      await window.confirmationResult.confirm(code);
    } catch (err) {
      showError("Invalid code. Please try again.");
      btn.disabled = false;
      btn.textContent = "Verify & Sign In";
    }
  }

  document.getElementById('send-code-btn').addEventListener('click', onSendCode);
  document.getElementById('verify-code-btn').addEventListener('click', onVerifyCode);

  async function syncPull() {
    const uid = activeUid();
    if (!uid) return;
    try {
      const doc = await db.collection('users').doc(uid).get();
      if (doc.exists) {
        const data = doc.data();
        state.activities = data.activities || [];
        state.events = data.events || [];
        state.savedNotes = data.savedNotes || [];
        render();
      }
    } catch (e) { console.error("Sync pull failed", e); }
  }

  async function syncPush() {
    if (state.readOnly) return;
    const uid = activeUid();
    if (!uid) return;
    try {
      await db.collection('users').doc(uid).set({
        activities: state.activities,
        events: state.events,
        savedNotes: state.savedNotes,
        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    } catch (e) { console.error("Sync push failed", e); }
  }

  function render() {
    if (state.readOnly) {
      document.body.classList.add('read-only');
      const mutators = document.querySelectorAll('.quick-add, .interrupt-btn, .undo-btn, .edit-action, .save-btn, .vaca-toggle, .ai-input');
      mutators.forEach(el => {
        el.classList.add('admin-disabled');
        el.setAttribute('title', 'Read-only admin view');
      });
    }
    // ... Additional dashboard rendering logic ...
  }

  auth.onAuthStateChanged(async (user) => {
    state.user = user;
    if (user) {
      if (state.viewAsUid) {
        try {
          const adminDoc = await db.collection('admins').doc((user.email || '').toLowerCase()).get();
          if (adminDoc.exists) {
            state.readOnly = true;
            document.getElementById('auth-ui').style.display = 'none';
            syncPull();
          } else {
            state.viewAsUid = null;
            window.location.href = "index.html";
          }
        } catch (e) {
          state.viewAsUid = null;
          window.location.href = "index.html";
        }
      } else {
        // Normal signed-in user logic
        if (window.location.pathname.includes('login.html')) {
          window.location.href = "index.html";
        } else {
          document.getElementById('auth-ui').style.display = 'none';
          syncPull();
        }
      }
    } else {
      if (!window.location.pathname.includes('login.html') && !state.viewAsUid) {
        // Redirect logic remains as per original security requirements
      }
    }
  });

  const otpBoxes = document.querySelectorAll('.otp-box');
  otpBoxes.forEach((box, idx) => {
    box.addEventListener('input', () => {
      if (box.value.length === 1 && idx < otpBoxes.length - 1) otpBoxes[idx + 1].focus();
    });
    box.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !box.value && idx > 0) otpBoxes[idx - 1].focus();
      if (e.key === 'Enter' && idx === otpBoxes.length - 1) onVerifyCode();
    });
  });
</script>
</body>
</html>
