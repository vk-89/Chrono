<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Chrono — Routine Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Runtime Config File -->
<script src="config.js"></script>

<!-- Firebase v10 SDK (Compat version for single-file browser usage) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --paper:#F4F3EC;
    --surface:#FFFFFF;
    --ink:#1C1E1B;
    --ink-soft:#63655D;
    --ink-faint:#9A9C92;
    --border:#E1DFD2;
    --border-strong:#CFCDBD;
    --study-h:208; --study-s:62%;
    --social-h:16; --social-s:72%;
    --essential-h:150; --essential-s:32%;
    --danger:#B3492F;
    --accent:#B3492F;
    --radius:14px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:84px;
  }
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace;}
  h1,h2,h3,.display{font-family:"Space Grotesk",-apple-system,sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px;}

  /* ---- Top bar ---- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--paper);
    padding-top:14px;padding-bottom:8px;
    border-bottom:1px solid transparent;
  }
  .topbar.scrolled{border-bottom-color:var(--border);}
  .topbar-row{display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:baseline;gap:7px;}
  .brand-mark{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,hsl(var(--study-h) var(--study-s) 50%),hsl(var(--social-h) var(--social-s) 55%));display:inline-block;}
  .brand h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-0.01em;}
  .authchip{
    display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:6px 12px 6px 6px;font-size:12.5px;color:var(--ink-soft);
  }
  .authchip .av{width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;}
  .cloud-badge{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);}
  .cloud-badge.on{background:#3E8E5A;}
  .cloud-badge.busy{background:#D3A227;animation:pulse 1s infinite;}

  /* ---- Timeline card ---- */
  .tl-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-top:12px;padding:14px 0 14px 14px;overflow:hidden;}
  .tl-head{display:flex;justify-content:space-between;align-items:baseline;padding-right:14px;margin-bottom:10px;}
  .tl-title{font-family:"Space Grotesk";font-weight:600;font-size:14.5px;}
  .tl-sub{font-size:11px;color:var(--ink-faint);}
  .tl-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding-right:14px;}
  .tl-inner{position:relative;}
  .tl-ruler{position:relative;height:16px;margin-bottom:8px;}
  .tl-tick{position:absolute;top:0;font-size:9.5px;color:var(--ink-faint);transform:translateX(-50%);white-space:nowrap;font-family:"JetBrains Mono";}
  .tl-tick::after{content:"";position:absolute;left:50%;top:13px;width:1px;height:5px;background:var(--border-strong);}
  .tl-day{margin-bottom:8px;}
  .tl-day-label{font-size:10.5px;color:var(--ink-soft);margin-bottom:3px;font-weight:600;font-family:"Space Grotesk";}
  .tl-track{position:relative;height:22px;border-radius:6px;background:var(--paper);overflow:visible;}
  .tl-seg{position:absolute;top:0;bottom:0;min-width:3px;border-radius:3px;}
  .tl-seg.live::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,0.35);animation:pulse 1.6s ease-in-out infinite;border-radius:3px;}
  .tl-marker{position:absolute;top:-4px;width:2px;height:30px;border-radius:1px;z-index:3;background:var(--mc,var(--ink));}
  .tl-marker::after{content:"";position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--mc,var(--ink));}
  .tl-now{position:absolute;top:0;width:2px;background:var(--accent);z-index:5;pointer-events:none;}
  .tl-now::before{content:"now";position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--accent);font-weight:700;font-family:"JetBrains Mono";white-space:nowrap;}
  @keyframes pulse{0%,100%{opacity:0.15;}50%{opacity:0;}}

  /* ---- Status card ---- */
  .status-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 14px 12px;margin-top:12px;
  }
  .status-main{display:flex;align-items:center;gap:11px;}
  .status-dot{width:13px;height:13px;border-radius:50%;flex:none;box-shadow:0 0 0 4px rgba(0,0,0,0.04);}
  .status-name{font-family:"Space Grotesk";font-weight:600;font-size:16.5px;line-height:1.2;}
  .status-since{color:var(--ink-soft);font-size:12.5px;margin-top:1px;}
  .status-empty{color:var(--ink-soft);font-size:14px;}
  .status-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .status-undo{background:none;border:none;color:var(--ink-faint);font-size:12px;text-decoration:underline;padding:4px;}

  /* ---- Tabs ---- */
  .tabs{display:flex;gap:4px;margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px;}
  .tab-btn{flex:1;border:none;background:none;padding:8px 0;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-soft);font-family:"Space Grotesk";}
  .tab-btn.active{background:var(--ink);color:#fff;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  /* ---- Quick add ---- */
  .qa-group{margin-top:18px;}
  .qa-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
  .qa-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .qa-btn{
    display:flex;align-items:center;gap:9px;
    background:var(--surface);border:1px solid var(--border);border-left:4px solid #ccc;
    border-radius:var(--radius-sm);padding:12px 12px;font-size:14px;font-weight:500;color:var(--ink);
    text-align:left;-webkit-user-select:none;user-select:none;
  }
  .qa-btn:active{transform:scale(0.97);background:var(--paper);}
  .qa-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .qa-instant{opacity:.55;font-size:11px;margin-left:2px;}
  .qa-add{
    margin-top:16px;width:100%;background:none;border:1.5px dashed var(--border-strong);
    border-radius:var(--radius-sm);padding:12px;font-size:13.5px;color:var(--ink-soft);font-weight:600;font-family:"Space Grotesk";
  }

  /* ---- Log list ---- */
  .log-section{margin-top:22px;}
  .section-title{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;font-family:"Space Grotesk";}
  .log-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--border);}
  .log-row:last-child{border-bottom:none;}
  .log-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .log-name{flex:1;font-size:14px;}
  .log-time{font-size:12.5px;color:var(--ink-soft);}
  .log-edit,.log-del{background:none;border:none;font-size:13px;padding:4px 5px;color:var(--ink-faint);}
  .log-editrow{display:flex;align-items:center;gap:8px;padding:9px 2px;}
  .log-editrow input[type=time]{font-family:"JetBrains Mono";border:1px solid var(--border-strong);border-radius:7px;padding:5px 7px;font-size:13px;}
  .log-editrow button{border:none;border-radius:7px;padding:6px 10px;font-size:12.5px;font-weight:600;}
  .btn-save{background:var(--ink);color:#fff;}
  .btn-cancel{background:var(--paper);color:var(--ink-soft);}
  .empty-note{font-size:13px;color:var(--ink-faint);padding:10px 2px;}

  /* ---- History ---- */
  .hist-day{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;margin-bottom:9px;}
  .hist-day-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .hist-date{font-weight:600;font-size:13.5px;font-family:"Space Grotesk";}
  .hist-total{font-size:11.5px;color:var(--ink-soft);}
  .hist-strip{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--paper);}
  .strip-seg{min-width:2px;}
  .strip-empty{font-size:12px;color:var(--ink-faint);display:flex;align-items:center;padding-left:10px;}
  .hist-detail{margin-top:9px;display:none;}
  .hist-detail.open{display:block;}
  .load-more{width:100%;background:none;border:1px solid var(--border);border-radius:999px;padding:10px;font-size:13px;color:var(--ink-soft);font-weight:600;font-family:"Space Grotesk";margin-top:4px;}

  /* ---- Stats ---- */
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
  .stat-card h3{font-size:13px;margin:0 0 10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
  .stat-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12.5px;}
  .stat-bar-label{width:70px;flex:none;color:var(--ink-soft);}
  .stat-bar-track{flex:1;height:9px;background:var(--paper);border-radius:999px;overflow:hidden;}
  .stat-bar-fill{height:100%;border-radius:999px;}
  .stat-bar-val{width:56px;flex:none;text-align:right;color:var(--ink-soft);}
  .stat-week-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .stat-week-day{width:34px;flex:none;font-size:11px;color:var(--ink-faint);}
  .stat-week-strip{flex:1;display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--paper);}

  /* ---- Insights ---- */
  .insight-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .insight-card h3{font-size:13px;margin:0 0 10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
  .insight-text{font-size:14px;line-height:1.65;color:var(--ink);white-space:pre-wrap;}
  .insight-meta{font-size:11px;color:var(--ink-faint);margin-top:10px;font-family:"JetBrains Mono";}
  .insight-empty{font-size:13px;color:var(--ink-soft);line-height:1.6;}
  .insight-loading{font-size:13px;color:var(--ink-faint);}
  .insight-stat-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border);}
  .insight-stat-row:last-child{border-bottom:none;}
  .insight-stat-label{color:var(--ink-soft);}
  .insight-stat-val{font-family:"JetBrains Mono";font-weight:600;}

  /* ---- Toast ---- */
  #toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:100;white-space:nowrap;
    max-width:90vw;overflow:hidden;text-overflow:ellipsis;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---- Modals ---- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,19,15,0.42);display:none;
    align-items:flex-end;justify-content:center;z-index:200;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    animation:slideUp .22s ease;max-height:86vh;overflow-y:auto;position:relative;
  }
  @keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal h2{font-size:17px;margin:0 0 14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .field input[type=text],.field input[type=email],.field input[type=password],.field input[type=time]{
    width:100%;border:1px solid var(--border-strong);border-radius:999px;padding:11px 12px;font-size:15px;font-family:inherit;background:var(--paper);
  }
  .pill-row{display:flex;gap:8px;}
  .pill{flex:1;border:1.5px solid var(--border-strong);border-radius:9px;padding:10px 8px;text-align:center;font-size:12.5px;font-weight:600;background:var(--surface);}
  .pill.active{border-color:var(--ink);background:var(--paper);}
  .pill i{display:block;width:10px;height:10px;border-radius:50%;margin:0 auto 5px;}
  .check-row{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .btn{flex:1;border:none;border-radius:10px;padding:13px;font-size:14.5px;font-weight:600;font-family:"Space Grotesk";}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-ghost{background:var(--paper);color:var(--ink-soft);}
  .btn-outline{background:none;border:1.5px solid var(--border-strong);color:var(--ink);}
  .divider-line{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--ink-faint);font-size:11.5px;}
  .divider-line::before,.divider-line::after{content:"";flex:1;height:1px;background:var(--border);}
  .authtoggle{display:flex;justify-content:center;gap:16px;font-size:12.5px;margin-top:12px;color:var(--ink-soft);}
  .authtoggle b{color:var(--ink);cursor:pointer;text-decoration:underline;}
  .auth-msg{font-size:12.5px;color:var(--danger);margin-top:8px;min-height:14px;}
  .cloud-note{font-size:12px;color:var(--ink-faint);background:var(--paper);border-radius:999px;padding:10px 11px;line-height:1.5;}
  .modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:15px;color:var(--ink-faint);}

  /* ---- Quote banner ---- */
  .quote-banner{
    margin-top:12px;padding:12px 14px;border-radius:var(--radius);
    background:linear-gradient(135deg, hsl(var(--study-h) var(--study-s) 96%), hsl(var(--social-h) var(--social-s) 95%));
    border:1px solid var(--border);font-size:13px;line-height:1.55;color:var(--ink);font-style:italic;
  }
  .quote-banner .qtag{display:block;font-style:normal;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-top:6px;}

  /* ---- Chat ---- */
  .chat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-top:14px;display:flex;flex-direction:column;overflow:hidden;}
  .chat-log{padding:12px;max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:9px;}
  .chat-msg{max-width:84%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;}
  .chat-msg.user{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px;}
  .chat-msg.ai{align-self:flex-start;background:var(--paper);color:var(--ink);border-bottom-left-radius:4px;}
  .chat-msg.system{align-self:center;background:none;color:var(--ink-faint);font-size:12px;font-style:italic;max-width:100%;text-align:center;}
  .chat-input-row{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);}
  .chat-input-row input{flex:1;border:1px solid var(--border-strong);border-radius:999px;padding:10px 14px;font-size:14px;font-family:inherit;background:var(--paper);}
  .chat-input-row button{border:none;border-radius:999px;padding:10px 16px;font-size:13.5px;font-weight:600;background:var(--ink);color:#fff;font-family:"Space Grotesk";flex:none;}
  .chat-input-row button:disabled{opacity:.5;}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar" id="topbar">
    <div class="topbar-row">
      <div class="brand"><span class="brand-mark"></span><h1>Chrono</h1></div>
      <button class="authchip" id="authChip">
        <span class="cloud-badge" id="cloudBadge"></span>
        <span id="authChipLabel">Guest</span>
      </button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="chat">Chat</button>
    <button class="tab-btn" data-tab="history">History</button>
    <button class="tab-btn" data-tab="stats">Stats</button>
  </div>

  <!-- Today -->
  <div class="tab-panel active" id="tab-today">

    <div class="quote-banner" id="quoteBanner"></div>

    <!-- Horizontal multi-day timeline -->
    <div class="tl-card">
      <div class="tl-head">
        <div class="tl-title">Timeline</div>
        <div class="tl-sub">day starts 4:00 AM · scroll ↔</div>
      </div>
      <div class="tl-scroll" id="tlScroll">
        <div class="tl-inner" id="tlInner">
          <div class="tl-ruler" id="tlRuler"></div>
          <div id="tlRows"></div>
          <div class="tl-now" id="tlNow"></div>
        </div>
      </div>
    </div>

    <!-- Current activity status -->
    <div class="status-card">
      <div class="status-row">
        <div class="status-main" id="statusCard"><div class="status-empty">Tap an activity below to start tracking.</div></div>
        <button class="status-undo" id="undoBtn" style="display:none;">Undo</button>
      </div>
    </div>

    <div id="quickAdd"></div>
    <div class="log-section">
      <div class="section-title">Today's log</div>
      <div id="todayLog"></div>
    </div>
  </div>

  <!-- History -->
  <div class="tab-panel" id="tab-history">
    <div style="margin-top:16px;" id="historyList"></div>
    <button class="load-more" id="loadMoreBtn">Load earlier days</button>
  </div>

  <!-- Stats -->
  <div class="tab-panel" id="tab-stats">
    <div style="margin-top:16px;" id="statsPanel"></div>
    <div class="stat-card">
      <h3>Export your data</h3>
      <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;line-height:1.5;">Download every activity you've ever logged, notes included.</div>
      <div class="modal-actions" style="margin-top:0;">
        <button class="btn btn-outline" id="exportJsonBtn">Export JSON</button>
        <button class="btn btn-outline" id="exportCsvBtn">Export CSV</button>
      </div>
    </div>
  </div>

  <!-- Chat -->
  <div class="tab-panel" id="tab-chat">
    <div style="margin-top:16px;" id="chatInsightPanel"></div>
    <div class="chat-card">
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Ask about your routine…" maxlength="400">
        <button id="chatSendBtn">Send</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Add Activity Modal -->
<div class="modal-backdrop" id="addModal">
  <div class="modal">
    <button class="modal-close" data-close="addModal">✕</button>
    <h2>Add activity</h2>
    <div class="field">
      <label>Name</label>
      <input type="text" id="actName" placeholder="e.g. Call — Sumit" maxlength="40">
    </div>
    <div class="field">
      <label>Category</label>
      <div class="pill-row" id="catPills">
        <button class="pill active" data-cat="study"><i style="background:hsl(var(--study-h) var(--study-s) 46%)"></i>Study</button>
        <button class="pill" data-cat="social"><i style="background:hsl(var(--social-h) var(--social-s) 52%)"></i>Social</button>
        <button class="pill" data-cat="essential"><i style="background:hsl(var(--essential-h) var(--essential-s) 40%)"></i>Essential</button>
      </div>
    </div>
    <div class="field">
      <label>Time</label>
      <input type="time" id="actTime">
    </div>
    <div class="field check-row">
      <input type="checkbox" id="actPin" checked style="width:16px;height:16px;">
      <label style="margin:0;font-weight:400;">Pin to quick-add grid</label>
    </div>
    <div class="field check-row">
      <input type="checkbox" id="actInstant" style="width:16px;height:16px;">
      <label style="margin:0;font-weight:400;">Instant marker (like Wake Up) — a moment, not an ongoing activity</label>
    </div>
    <div class="field check-row">
      <input type="checkbox" id="actNeedsDetail" style="width:16px;height:16px;">
      <label style="margin:0;font-weight:400;">Ask for a short note each time (e.g. who you're calling, what you're doing)</label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="saveOnlyBtn">Save only</button>
      <button class="btn btn-primary" id="saveLogBtn">Save & log now</button>
    </div>
  </div>
</div>

<!-- Detail prompt modal (for activities like Call / Timepass) -->

<script>
(function(){
"use strict";

/* ============================= CONFIG LOADING ============================= */
function getFirebaseConfig() {
  if (window.APP_CONFIG && window.APP_CONFIG.firebase) {
    return window.APP_CONFIG.firebase;
  }
  return null;
}

const firebaseConfig = getFirebaseConfig();
const CLOUD_ENABLED = !!(firebaseConfig && firebaseConfig.apiKey && !firebaseConfig.apiKey.includes('YOUR_'));

let auth = null;
let db = null;

if (CLOUD_ENABLED) {
  try {
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
  } catch(e) {
    console.error("Firebase init failed", e);
  }
}

const CATEGORY_LABELS = { study:'Study', social:'Social & Fun', essential:'Essential' };
const CATEGORY_HUE = { study:208, social:16, essential:150 };
const CATEGORY_SAT = { study:62, social:72, essential:32 };

const PALETTE = [
  '#2563EB','#DC2626','#059669','#D97706','#7C3AED','#DB2777',
  '#0891B2','#65A30D','#EA580C','#4F46E5','#0D9488','#C026D3',
  '#B45309','#1D4ED8','#BE123C','#15803D','#9333EA','#0EA5E9',
  '#CA8A04','#E11D48','#166534','#7E22CE','#0369A1','#A16207'
];

const QUOTES = [
  "Discipline is choosing between what you want now and what you want most.",
  "You don't rise to the level of your goals, you fall to the level of your systems.",
  "The days are long, but the logged hours don't lie.",
  "Small, boring, repeated actions compound into a life.",
  "What gets tracked gets noticed. What gets noticed gets better.",
  "Motivation gets you started. Routine keeps you going.",
  "A day well-logged is a day you can actually learn from.",
  "You can't manage what you don't measure — start with today.",
  "Progress is invisible day to day, obvious month to month.",
  "The best time to fix your routine was this morning. The next best time is now.",
  "Every activity you log is a vote for the person you're becoming.",
  "Consistency beats intensity, almost every time.",
  "Don't count the hours, make the hours count.",
  "Rest is not the opposite of productivity — it's part of it.",
  "You are one honest look at your timeline away from a better week.",
];
function quoteForToday(){
  const seed = hashStr(todayLogicalDate());
  return QUOTES[seed % QUOTES.length];
}
function renderQuoteBanner(){
  const el = document.getElementById('quoteBanner');
  if(!el) return;
  el.innerHTML = '"'+escapeHtml(quoteForToday())+'"<span class="qtag">Today\'s reflection · day starts 4:00 AM</span>';
}

const DAY_START_HOUR = 4;
const PX_PER_HOUR = 42;
const DAY_WIDTH = 24 * PX_PER_HOUR;
const TIMELINE_DAYS = 7;
const INSIGHTS_LOOKBACK_DAYS = 14;

const DEFAULT_ACTIVITIES = [
  {name:'Wake Up', category:'essential', instant:true},
  {name:'Ready', category:'essential'},
  {name:'Bath', category:'essential'},
  {name:'Breakfast', category:'essential'},
  {name:'Lunch', category:'essential'},
  {name:'Dinner', category:'essential'},
  {name:'Commute', category:'essential'},
  {name:'Rest', category:'essential'},
  {name:'Cooking', category:'essential'},
  {name:'Sleep', category:'essential'},
  {name:'Library', category:'study'},
  {name:'Coaching', category:'study'},
  {name:'Newspaper', category:'study'},
  {name:'Website Work', category:'study'},
  {name:'Call', category:'social'},
  {name:'Timepass', category:'social'},
  {name:'Hobby', category:'social'},
];

const LS = {
  activities:'chrono_activities_v2',
  events:'chrono_events_v2',
  deletes:'chrono_pending_deletes_v2',
};

/* ============================= UTIL ============================= */
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); }
function pad(n){ return String(n).padStart(2,'0'); }
function localDateStr(d){ d = d || new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmt12(d){ let h=d.getHours(), m=d.getMinutes(); const ap=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12; return h+':'+pad(m)+' '+ap; }
function durationLabel(mins){ mins = Math.max(0,Math.round(mins)); const h=Math.floor(mins/60), m=mins%60; return h ? (h+'h '+m+'m') : (m+'m'); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hashStr(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; } return h; }
function paletteColor(name){ return PALETTE[hashStr((name||'').toLowerCase().trim()) % PALETTE.length]; }
function categoryColor(cat){ return 'hsl(' + CATEGORY_HUE[cat] + ' ' + CATEGORY_SAT[cat] + '% 46%)'; }
function loadLS(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function saveLS(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ console.error('localStorage save failed', e); } }
function debounce(fn, ms){ let t; return function(){ clearTimeout(t); const a=arguments; t=setTimeout(()=>fn.apply(null,a), ms); }; }

function logicalDateStr(d){
  const shifted = new Date(d.getTime() - DAY_START_HOUR*3600000);
  return localDateStr(shifted);
}
function todayLogicalDate(){ return logicalDateStr(new Date()); }
function dayBoundaryStart(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  d.setHours(d.getHours()+DAY_START_HOUR);
  return d;
}
function minutesIntoDay(date, dateStr){
  return (date - dayBoundaryStart(dateStr)) / 60000;
}
function dayLabel(dateStr){
  const todayL = todayLogicalDate();
  if(dateStr === todayL) return 'Today';
  const yest = new Date(todayL+'T00:00:00'); yest.setDate(yest.getDate()-1);
  if(dateStr === localDateStr(yest)) return 'Yesterday';
  return new Date(dateStr+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short', day:'numeric', month:'short'});
}
function last7LogicalDates(){
  const base = new Date(todayLogicalDate()+'T00:00:00');
  const out = [];
  for(let i=TIMELINE_DAYS-1;i>=0;i--){
    const d = new Date(base); d.setDate(d.getDate()-i);
    out.push(localDateStr(d));
  }
  return out;
}
function lastNLogicalDates(n){
  const base = new Date(todayLogicalDate()+'T00:00:00');
  const out = [];
  for(let i=n-1;i>=0;i--){
    const d = new Date(base); d.setDate(d.getDate()-i);
    out.push(localDateStr(d));
  }
  return out;
}

/* ============================= STATE ============================= */
const state = {
  user: null,
  activities: loadLS(LS.activities, null) || DEFAULT_ACTIVITIES.map(a => ({
    id: uid(), name:a.name, category:a.category, color: paletteColor(a.name),
    instant: !!a.instant, needsDetail: defaultNeedsDetail(a.name), is_pinned:true, synced:false, updated_at: new Date().toISOString(),
  })),
  events: loadLS(LS.events, []),
  pendingDeletes: loadLS(LS.deletes, []),
  editingId: null,
  historyDaysShown: 7,
  authMode: 'signin',
};

state.activities.forEach(a=>{
  a.color = paletteColor(a.name);
  if(a.instant === undefined) a.instant = (a.name === 'Wake Up');
  if(a.needsDetail === undefined) a.needsDetail = defaultNeedsDetail(a.name);
});
saveLS(LS.activities, state.activities);

function persistActivities(){ saveLS(LS.activities, state.activities); }
function persistEvents(){ saveLS(LS.events, state.events); }
function persistDeletes(){ saveLS(LS.deletes, state.pendingDeletes); }

/* ============================= CORE ACTIONS ============================= */
function currentEvent(){
  const todayL = todayLogicalDate();
  const todays = state.events
    .filter(e => logicalDateStr(new Date(e.start_time)) === todayL)
    .sort((a,b)=> new Date(a.start_time) - new Date(b.start_time));
  return todays.length ? todays[todays.length-1] : null;
}

function logActivity(activity, atDate, detail){
  atDate = atDate || new Date();
  const ev = {
    id: uid(), client_id: uid(),
    activity_id: activity.id, activity_name: activity.name,
    category: activity.category, color: activity.color,
    instant: !!activity.instant,
    detail: (detail||'').trim(),
    start_time: atDate.toISOString(), date: logicalDateStr(atDate),
    synced:false,
  };
  state.events.push(ev);
  state.events.sort((a,b)=> new Date(a.start_time) - new Date(b.start_time));
  persistEvents();
  renderAll();
  showToast((activity.instant ? 'Marked ' : 'Logged ') + activity.name + (ev.detail ? ' — '+ev.detail : '') + ' · ' + fmt12(atDate));
  queueSync();
}

function updateEventTime(id, hh, mm){
  const ev = state.events.find(e=>e.id===id);
  if(!ev) return;
  // Rebuild the datetime from the event's LOGICAL date rather than just
  // patching hours/minutes onto the old calendar date. A logical day runs
  // 4:00 AM -> 3:59 AM, so times before DAY_START_HOUR belong to the next
  // calendar date. Without this, editing an entry to/from a past-midnight
  // time (e.g. 12:30 AM) silently jumped it a full day backward/forward.
  const logicalDate = ev.date || logicalDateStr(new Date(ev.start_time));
  const d = new Date(logicalDate+'T00:00:00');
  if(hh < DAY_START_HOUR) d.setDate(d.getDate()+1);
  d.setHours(hh, mm, 0, 0);
  ev.start_time = d.toISOString();
  ev.date = logicalDateStr(d);
  ev.synced = false;
  state.events.sort((a,b)=> new Date(a.start_time) - new Date(b.start_time));
  persistEvents();
  state.editingId = null;
  renderAll();
  queueSync();
}

function deleteEvent(id){
  const ev = state.events.find(e=>e.id===id);
  state.events = state.events.filter(e=>e.id!==id);
  persistEvents();
  if(ev && ev.synced){ state.pendingDeletes.push(ev.id); persistDeletes(); }
  renderAll();
  queueSync();
}

function defaultNeedsDetail(name){
  const n = (name||'').toLowerCase().trim();
  return n === 'call' || n === 'timepass';
}

function addActivity(opts){
  const name = (opts.name||'').trim();
  if(!name) return null;
  const existing = state.activities.find(a => a.name.toLowerCase() === name.toLowerCase());
  if(existing){
    if(opts.pin) existing.is_pinned = true;
    if(opts.instant !== undefined) existing.instant = !!opts.instant;
    if(opts.needsDetail !== undefined) existing.needsDetail = !!opts.needsDetail;
    persistActivities();
    return existing;
  }
  const act = {
    id: uid(), name, category: opts.category || 'essential',
    color: paletteColor(name),
    instant: !!opts.instant,
    needsDetail: opts.needsDetail !== undefined ? !!opts.needsDetail : defaultNeedsDetail(name),
    is_pinned: !!opts.pin, synced:false, updated_at: new Date().toISOString(),
  };
  state.activities.push(act);
  persistActivities();
  return act;
}

function computeGlobalSegments(){
  const events = state.events.slice().sort((a,b)=> new Date(a.start_time)-new Date(b.start_time));
  const ranges = [], markers = [];
  const now = new Date();
  const nowLogical = todayLogicalDate();
  for(let i=0;i<events.length;i++){
    const ev = events[i];
    const start = new Date(ev.start_time);
    if(ev.instant){ markers.push(Object.assign({}, ev, {start})); continue; }
    let end, live=false;
    if(i < events.length-1){
      end = new Date(events[i+1].start_time);
    } else {
      const evLogical = logicalDateStr(start);
      if(evLogical === nowLogical){ end = now; live = true; }
      else { end = new Date(dayBoundaryStart(evLogical).getTime() + 24*3600000); }
    }
    if(end <= start) end = new Date(start.getTime()+60000);
    ranges.push(Object.assign({}, ev, {start, end, live}));
  }
  return {ranges, markers};
}

function segmentsForDay(dateStr, ranges){
  const ds = dayBoundaryStart(dateStr), de = new Date(ds.getTime()+24*3600000);
  const out = [];
  ranges.forEach(r=>{
    const st = r.start < ds ? ds : r.start;
    const en = r.end > de ? de : r.end;
    if(en > st) out.push(Object.assign({}, r, {start:st, end:en}));
  });
  return out;
}
function markersForDay(dateStr, markers){
  const ds = dayBoundaryStart(dateStr), de = new Date(ds.getTime()+24*3600000);
  return markers.filter(m=> m.start >= ds && m.start < de);
}

/* ============================= RENDER ============================= */
function renderRuler(){
  const el = document.getElementById('tlRuler');
  el.style.width = DAY_WIDTH+'px';
  let html = '';
  for(let h=0; h<=24; h+=3){
    const clockHour = (DAY_START_HOUR + h) % 24;
    const label = clockHour===0 ? '12A' : clockHour<12 ? (clockHour+'A') : clockHour===12 ? '12P' : ((clockHour-12)+'P');
    html += '<span class="tl-tick" style="left:'+(h*PX_PER_HOUR)+'px">'+label+'</span>';
  }
  el.innerHTML = html;
}

function renderTimeline(){
  renderRuler();
  const {ranges, markers} = computeGlobalSegments();
  const dates = last7LogicalDates();
  const rowsEl = document.getElementById('tlRows');
  let html = '';
  dates.forEach(dateStr=>{
    const segs = segmentsForDay(dateStr, ranges);
    const mks = markersForDay(dateStr, markers);
    let inner = '';
    segs.forEach(s=>{
      const left = minutesIntoDay(s.start, dateStr) * PX_PER_HOUR/60;
      const width = Math.max(3, (s.end-s.start)/60000 * PX_PER_HOUR/60);
      inner += '<div class="tl-seg'+(s.live?' live':'')+'" style="left:'+left+'px;width:'+width+'px;background:'+s.color+'" title="'+escapeHtml(s.activity_name)+' · '+fmt12(s.start)+'–'+(s.live?'now':fmt12(s.end))+'"></div>';
    });
    mks.forEach(m=>{
      const left = minutesIntoDay(m.start, dateStr) * PX_PER_HOUR/60;
      inner += '<div class="tl-marker" style="left:'+left+'px;--mc:'+m.color+'" title="'+escapeHtml(m.activity_name)+' · '+fmt12(m.start)+'"></div>';
    });
    html += '<div class="tl-day"><div class="tl-day-label">'+dayLabel(dateStr)+'</div><div class="tl-track" style="width:'+DAY_WIDTH+'px">'+inner+'</div></div>';
  });
  rowsEl.innerHTML = html;
  rowsEl.style.width = DAY_WIDTH+'px';

  const nowEl = document.getElementById('tlNow');
  const todayL = todayLogicalDate();
  const nowLeft = minutesIntoDay(new Date(), todayL) * PX_PER_HOUR/60;
  const rulerH = document.getElementById('tlRuler').offsetHeight;
  const rowsH = rowsEl.offsetHeight;
  nowEl.style.left = nowLeft+'px';
  nowEl.style.top = '0px';
  nowEl.style.height = (rulerH + 8 + rowsH) + 'px';

  const scrollEl = document.getElementById('tlScroll');
  if(!scrollEl.dataset.userScrolled){
    scrollEl.scrollLeft = Math.max(0, nowLeft - scrollEl.clientWidth/2);
  }
}

function renderStatus(){
  const el = document.getElementById('statusCard');
  const undoBtn = document.getElementById('undoBtn');
  const ev = currentEvent();
  if(!ev){
    el.innerHTML = '<div class="status-empty">Tap an activity below to start tracking.</div>';
    undoBtn.style.display = 'none';
    return;
  }
  const start = new Date(ev.start_time);
  if(ev.instant){
    el.innerHTML =
      '<span class="status-dot" style="background:'+ev.color+'"></span>' +
      '<div><div class="status-name">'+escapeHtml(ev.activity_name)+'</div>' +
      '<div class="status-since mono">at '+fmt12(start)+' · log what\'s next</div></div>';
  } else {
    el.innerHTML =
      '<span class="status-dot" style="background:'+ev.color+'"></span>' +
      '<div><div class="status-name">'+escapeHtml(ev.activity_name)+'</div>' +
      '<div class="status-since mono">since '+fmt12(start)+' · <span id="statusElapsed">'+durationLabel((Date.now()-start)/60000)+'</span></div></div>';
  }
  undoBtn.style.display = 'inline-block';
}

function renderQuickAdd(){
  const container = document.getElementById('quickAdd');
  const groups = { study:[], social:[], essential:[] };
  state.activities.filter(a=>a.is_pinned).forEach(a=>{ if(groups[a.category]) groups[a.category].push(a); });
  let html = '';
  ['study','social','essential'].forEach(cat=>{
    if(!groups[cat].length) return;
    html += '<div class="qa-group"><div class="qa-label" style="color:'+categoryColor(cat)+'">'+CATEGORY_LABELS[cat]+'</div><div class="qa-grid">';
    groups[cat].forEach(a=>{
      html += '<button class="qa-btn" style="border-left-color:'+a.color+'" data-id="'+a.id+'"><span class="qa-dot" style="background:'+a.color+'"></span>'+escapeHtml(a.name)+(a.instant?' <span class="qa-instant">⚡</span>':'')+'</button>';
    });
    html += '</div></div>';
  });
  html += '<button class="qa-add" id="addActOpenBtn">+ Add activity</button>';
  container.innerHTML = html;
}

function renderTodayLog(){
  const container = document.getElementById('todayLog');
  const todayL = todayLogicalDate();
  const dayEvents = state.events
    .filter(e => logicalDateStr(new Date(e.start_time)) === todayL)
    .sort((a,b)=> new Date(b.start_time)-new Date(a.start_time));
  if(!dayEvents.length){ container.innerHTML = '<div class="empty-note">Nothing logged yet today.</div>'; return; }
  container.innerHTML = dayEvents.map(e=>{
    if(state.editingId === e.id){
      const d = new Date(e.start_time);
      const val = pad(d.getHours())+':'+pad(d.getMinutes());
      return '<div class="log-editrow" data-id="'+e.id+'">' +
        '<input type="time" id="editTimeInput" value="'+val+'">' +
        '<button class="btn-save" data-action="saveEdit" data-id="'+e.id+'">Save</button>' +
        '<button class="btn-cancel" data-action="cancelEdit">Cancel</button></div>';
    }
    const nameHtml = escapeHtml(e.activity_name) + (e.detail ? ' <span style="color:var(--ink-faint);font-weight:400;">— '+escapeHtml(e.detail)+'</span>' : '') + (e.instant?' ⚡':'');
    return '<div class="log-row" data-id="'+e.id+'">' +
      '<span class="log-dot" style="background:'+e.color+'"></span>' +
      '<span class="log-name">'+nameHtml+'</span>' +
      '<span class="log-time mono">'+fmt12(new Date(e.start_time))+'</span>' +
      '<button class="log-edit" data-action="edit" data-id="'+e.id+'">✎</button>' +
      '<button class="log-del" data-action="del" data-id="'+e.id+'">🗑</button></div>';
  }).join('');
}

function allDatesWithData(limit){
  const set = new Set(state.events.map(e => e.date || logicalDateStr(new Date(e.start_time))));
  set.add(todayLogicalDate());
  return Array.from(set).sort().reverse().slice(0, limit);
}

function renderHistory(){
  const container = document.getElementById('historyList');
  const dates = allDatesWithData(state.historyDaysShown);
  const {ranges, markers} = computeGlobalSegments();
  container.innerHTML = dates.map(dateStr=>{
    const segs = segmentsForDay(dateStr, ranges);
    const mks = markersForDay(dateStr, markers);
    const totalMins = segs.reduce((s,x)=> s + (x.end-x.start)/60000, 0);
    let stripHtml = '';
    if(!segs.length && !mks.length){
      stripHtml = '<div class="strip-empty">No data</div>';
    } else {
      stripHtml = segs.map(s=> '<div class="strip-seg" style="flex-grow:'+((s.end-s.start)/60000)+';background:'+s.color+'" title="'+escapeHtml(s.activity_name)+' '+fmt12(s.start)+'–'+fmt12(s.end)+'"></div>').join('');
    }
    const rangeRows = segs.map(s=>
      '<div class="log-row"><span class="log-dot" style="background:'+s.color+'"></span><span class="log-name">'+escapeHtml(s.activity_name)+(s.detail?' <span style="color:var(--ink-faint);font-weight:400;">— '+escapeHtml(s.detail)+'</span>':'')+'</span><span class="log-time mono">'+fmt12(s.start)+' – '+fmt12(s.end)+' ('+durationLabel((s.end-s.start)/60000)+')</span></div>'
    ).join('');
    const markerRows = mks.map(m=>
      '<div class="log-row"><span class="log-dot" style="background:'+m.color+'"></span><span class="log-name">'+escapeHtml(m.activity_name)+(m.detail?' <span style="color:var(--ink-faint);font-weight:400;">— '+escapeHtml(m.detail)+'</span>':'')+' ⚡</span><span class="log-time mono">'+fmt12(m.start)+'</span></div>'
    ).join('');
    const detailHtml = (rangeRows + markerRows) || '<div class="empty-note">No entries.</div>';
    return '<div class="hist-day" data-date="'+dateStr+'">' +
      '<div class="hist-day-head"><span class="hist-date">'+dayLabel(dateStr)+'</span><span class="hist-total mono">'+(totalMins?durationLabel(totalMins):'')+'</span></div>' +
      '<div class="hist-strip">'+stripHtml+'</div>' +
      '<div class="hist-detail" id="detail-'+dateStr+'">'+detailHtml+'</div>' +
      '</div>';
  }).join('');
}

function renderStats(){
  const container = document.getElementById('statsPanel');
  const {ranges} = computeGlobalSegments();
  const todayL = todayLogicalDate();
  const todaySegs = segmentsForDay(todayL, ranges);
  const todayTotals = {study:0, social:0, essential:0};
  todaySegs.forEach(s=>{ todayTotals[s.category] = (todayTotals[s.category]||0) + (s.end-s.start)/60000; });
  const todayGrandTotal = Object.values(todayTotals).reduce((a,b)=>a+b,0) || 1;

  let html = '<div class="stat-card"><h3>Today\'s split</h3>';
  ['study','social','essential'].forEach(cat=>{
    const mins = todayTotals[cat] || 0;
    const pct = Math.round((mins/todayGrandTotal)*100);
    html += '<div class="stat-bar-row"><span class="stat-bar-label">'+CATEGORY_LABELS[cat]+'</span>' +
      '<span class="stat-bar-track"><span class="stat-bar-fill" style="width:'+pct+'%;background:'+categoryColor(cat)+'"></span></span>' +
      '<span class="stat-bar-val mono">'+(mins?durationLabel(mins):'0m')+'</span></div>';
  });
  html += '</div>';

  html += '<div class="stat-card"><h3>Last 7 days · category totals</h3>';
  const last7 = last7LogicalDates();
  const dayLabels = last7.map(ds => dayLabel(ds)==='Today' ? 'Tdy' : new Date(ds+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short'}).slice(0,2));
  last7.forEach((ds,i)=>{
    const segs = segmentsForDay(ds, ranges);
    const totals = {study:0, social:0, essential:0};
    let grand = 0;
    segs.forEach(s=>{ const m=(s.end-s.start)/60000; totals[s.category]=(totals[s.category]||0)+m; grand += m; });
    let segHtml = '';
    if(grand > 0){
      ['study','social','essential'].forEach(cat=>{
        if(totals[cat] > 0) segHtml += '<div style="flex-grow:'+totals[cat]+';background:'+categoryColor(cat)+'"></div>';
      });
    }
    html += '<div class="stat-week-row"><span class="stat-week-day">'+dayLabels[i]+'</span>' +
      '<span class="stat-week-strip">'+segHtml+'</span>' +
      '<span class="hist-total mono" style="width:44px;text-align:right;">'+(grand?durationLabel(grand):'—')+'</span></div>';
  });
  html += '</div>';

  const personal = computePersonalAverages(INSIGHTS_LOOKBACK_DAYS);
  html += '<div class="stat-card"><h3>Your last '+INSIGHTS_LOOKBACK_DAYS+' days</h3>';
  if(personal.daysLogged < 3){
    html += '<div class="insight-empty">Log a few more days and this section will start showing your averages.</div>';
  } else {
    html +=
      '<div class="insight-stat-row"><span class="insight-stat-label">Wake time</span><span class="insight-stat-val">'+fmtWakeClock(personal.avgWakeMinutes)+' avg</span></div>' +
      '<div class="insight-stat-row"><span class="insight-stat-label">Study</span><span class="insight-stat-val">'+durationLabel(personal.avgStudy)+'/day avg</span></div>' +
      '<div class="insight-stat-row"><span class="insight-stat-label">Social & Fun</span><span class="insight-stat-val">'+durationLabel(personal.avgSocial)+'/day avg</span></div>' +
      '<div class="insight-stat-row"><span class="insight-stat-label">Essential</span><span class="insight-stat-val">'+durationLabel(personal.avgEssential)+'/day avg</span></div>';
    const diff = computeTodayWakeDeviation(personal);
    if(diff != null && Math.abs(diff) >= 20){
      html += '<div class="insight-stat-row"><span class="insight-stat-label">Today vs average</span><span class="insight-stat-val" style="color:var(--accent)">'+Math.round(Math.abs(diff))+'m '+(diff>0?'later':'earlier')+'</span></div>';
    }
  }
  html += '</div>';

  container.innerHTML = html;
}

function downloadBlob(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}
function exportJson(){
  const events = state.events.slice().sort((a,b)=> new Date(a.start_time)-new Date(b.start_time));
  const payload = {
    exported_at: new Date().toISOString(),
    activities: state.activities.map(a=>({ id:a.id, name:a.name, category:a.category, instant:!!a.instant, needsDetail:!!a.needsDetail })),
    events: events.map(e=>({ id:e.id, activity_name:e.activity_name, category:e.category, detail:e.detail||'', instant:!!e.instant, start_time:e.start_time, date:e.date }))
  };
  downloadBlob('chrono-export-'+localDateStr()+'.json', JSON.stringify(payload, null, 2), 'application/json');
  showToast('Exported '+events.length+' activities as JSON');
}
function csvEscape(v){ v = String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function exportCsv(){
  const events = state.events.slice().sort((a,b)=> new Date(a.start_time)-new Date(b.start_time));
  const rows = [['date','start_time','activity','category','detail','instant']];
  events.forEach(e=>{
    rows.push([e.date, e.start_time, e.activity_name, e.category, e.detail||'', e.instant?'yes':'no']);
  });
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\n');
  downloadBlob('chrono-export-'+localDateStr()+'.csv', csv, 'text/csv');
  showToast('Exported '+events.length+' activities as CSV');
}
document.getElementById('exportJsonBtn').addEventListener('click', exportJson);
document.getElementById('exportCsvBtn').addEventListener('click', exportCsv);

/* ---- Insights: personal stats are computed instantly, client-side, for
   free. The AI narration text is fetched from Firestore, where the nightly
   GitHub Action writes it (see scripts/generate-insights.mjs). ---- */

function computePersonalAverages(days){
  const {ranges} = computeGlobalSegments();
  const dates = lastNLogicalDates(days);
  const totals = {study:[], social:[], essential:[]};
  const wakeMinutesArr = [];
  dates.forEach(ds=>{
    const segs = segmentsForDay(ds, ranges);
    if(!segs.length) return;
    const dayTotals = {study:0, social:0, essential:0};
    segs.forEach(s=>{ dayTotals[s.category] += (s.end-s.start)/60000; });
    ['study','social','essential'].forEach(c=> totals[c].push(dayTotals[c]));
    let firstStart = segs[0].start;
    segs.forEach(s=>{ if(s.start < firstStart) firstStart = s.start; });
    wakeMinutesArr.push(minutesIntoDay(firstStart, ds));
  });
  function avg(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
  return {
    daysLogged: wakeMinutesArr.length,
    avgWakeMinutes: avg(wakeMinutesArr),
    avgStudy: avg(totals.study),
    avgSocial: avg(totals.social),
    avgEssential: avg(totals.essential),
  };
}

function fmtWakeClock(mins){
  if(mins==null) return '—';
  const total = ((DAY_START_HOUR*60 + mins) % (24*60) + 24*60) % (24*60);
  const d = new Date(); d.setHours(0,0,0,0); d.setMinutes(total);
  return fmt12(d);
}

function computeTodayWakeDeviation(personal){
  const {ranges} = computeGlobalSegments();
  const todayL = todayLogicalDate();
  const segs = segmentsForDay(todayL, ranges);
  if(!segs.length || personal.avgWakeMinutes==null) return null;
  let firstStart = segs[0].start;
  segs.forEach(s=>{ if(s.start < firstStart) firstStart = s.start; });
  const todayWake = minutesIntoDay(firstStart, todayL);
  return todayWake - personal.avgWakeMinutes;
}

/* ============================= LIVE AI CHAT ============================= */
// Reads window.APP_CONFIG.gemini.apiKey from config.js, the same file that
// carries the Firebase config. Calls the Gemini API directly from the
// client — fine for a personal single-user tool, not meant for a shared
// deployment with a public key.
function getGeminiKey(){
  return (window.APP_CONFIG && window.APP_CONFIG.gemini && window.APP_CONFIG.gemini.apiKey) || null;
}
const GEMINI_ENABLED = !!getGeminiKey();
const LS_CHAT = 'chrono_chat_v1';
state.chatMessages = loadLS(LS_CHAT, []);

function buildChatContext(){
  const personal = computePersonalAverages(INSIGHTS_LOOKBACK_DAYS);
  const {ranges} = computeGlobalSegments();
  const recentDates = lastNLogicalDates(5);
  const recentLines = recentDates.map(ds=>{
    const segs = segmentsForDay(ds, ranges);
    if(!segs.length) return dayLabel(ds)+': no data';
    const parts = segs.map(s => s.activity_name + (s.detail?' ('+s.detail+')':'') + ' ' + fmt12(s.start)+'-'+fmt12(s.end));
    return dayLabel(ds)+': ' + parts.join(', ');
  }).join('\n');
  return [
    'You are a concise, encouraging personal routine coach inside a time-tracking app called Chrono.',
    'The user logs activities in three categories: Study, Social & Fun, Essential.',
    'Their averages over the last '+INSIGHTS_LOOKBACK_DAYS+' days: wake time '+fmtWakeClock(personal.avgWakeMinutes)+
      ', study '+durationLabel(personal.avgStudy||0)+'/day, social '+durationLabel(personal.avgSocial||0)+'/day, essential '+durationLabel(personal.avgEssential||0)+'/day.',
    'Their last 5 logged days:',
    recentLines || 'No data yet.',
    'Answer the user\'s question directly and briefly (a few sentences unless asked for more). Reference their actual logged data when relevant. Be honest, not just cheerleading.'
  ].join('\n');
}

function renderChatLog(){
  const el = document.getElementById('chatLog');
  if(!el) return;
  if(!state.chatMessages.length){
    el.innerHTML = '<div class="chat-msg system">Ask me anything about your routine — e.g. "How much have I studied this week?" or "Why do I keep sleeping late?"</div>';
  } else {
    el.innerHTML = state.chatMessages.map(m=>
      '<div class="chat-msg '+m.role+'">'+escapeHtml(m.text)+'</div>'
    ).join('');
  }
  el.scrollTop = el.scrollHeight;
}

async function sendChatMessage(text){
  text = (text||'').trim();
  if(!text) return;
  if(!GEMINI_ENABLED){
    state.chatMessages.push({role:'system', text:'AI chat isn\'t configured yet — add a gemini.apiKey to config.js to enable it.'});
    saveLS(LS_CHAT, state.chatMessages);
    renderChatLog();
    return;
  }
  state.chatMessages.push({role:'user', text});
  saveLS(LS_CHAT, state.chatMessages);
  renderChatLog();

  const sendBtn = document.getElementById('chatSendBtn');
  sendBtn.disabled = true;
  state.chatMessages.push({role:'ai', text:'…'});
  renderChatLog();

  try {
    const history = state.chatMessages.filter(m=>m.role==='user'||m.role==='ai').slice(-13, -1);
    const contents = history.map(m=>({ role: m.role==='ai'?'model':'user', parts:[{text:m.text}] }));
    contents.push({ role:'user', parts:[{text}] });

    // NOTE: gemini-2.0-flash was retired by Google on June 1, 2026 — every call
    // to it now 404s. gemini-2.5-flash is the current stable replacement.
    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+getGeminiKey(), {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        system_instruction: { parts:[{text: buildChatContext()}] },
        contents,
      })
    });
    const data = await res.json();
    let reply;
    if(!res.ok || data.error){
      // Surface the real reason instead of a generic message, so a bad key,
      // a retired model, or a rate limit are each recognizable at a glance.
      reply = 'AI request failed (' + (data.error && data.error.code || res.status) + '): ' + (data.error && data.error.message || 'unknown error');
    } else if(data.candidates && data.candidates[0] && data.candidates[0].content){
      reply = data.candidates[0].content.parts.map(p=>p.text).join('');
    } else if(data.candidates && data.candidates[0] && data.candidates[0].finishReason){
      reply = 'Response was blocked (reason: ' + data.candidates[0].finishReason + '). Try rephrasing.';
    } else {
      reply = 'Sorry, I couldn\'t generate a response just now.';
    }
    state.chatMessages[state.chatMessages.length-1] = {role:'ai', text:reply};
  } catch(err){
    console.error('Chat request failed', err);
    state.chatMessages[state.chatMessages.length-1] = {role:'ai', text:'Something went wrong reaching the AI — check your connection and try again.'};
  }
  saveLS(LS_CHAT, state.chatMessages);
  renderChatLog();
  sendBtn.disabled = false;
}

  const input = document.getElementById('chatInput');

}

/* ============================= SYNC ============================= */
const queueSync = debounce(()=>{ if(CLOUD_ENABLED && state.user) syncPush(); }, 1500);

function setSyncBusy(busy){
  const badge = document.getElementById('cloudBadge');
  if(!badge) return;
  if(busy){ badge.className = 'cloud-badge busy'; }
  else { badge.className = state.user ? 'cloud-badge on' : 'cloud-badge'; }
}

async function syncPush(){
  if(!CLOUD_ENABLED || !state.user) return;
  setSyncBusy(true);
  try {
    const uid = state.user.uid;
    const batch = db.batch();

    const unsyncedActs = state.activities.filter(a => !a.synced);
    unsyncedActs.forEach(a => {
      const ref = db.collection('users').doc(uid).collection('activities').doc(a.id);
      batch.set(ref, {
        id: a.id,
        name: a.name,
        category: a.category,
        color: a.color,
        instant: !!a.instant,
        is_pinned: a.is_pinned,
        updated_at: new Date().toISOString()
      }, { merge: true });
    });

    const unsyncedEvs = state.events.filter(e => !e.synced);
    unsyncedEvs.forEach(e => {
      const ref = db.collection('users').doc(uid).collection('events').doc(e.id);
      batch.set(ref, {
        id: e.id,
        client_id: e.client_id || e.id,
        activity_id: e.activity_id,
        activity_name: e.activity_name,
        category: e.category,
        color: e.color,
        instant: !!e.instant,
        start_time: e.start_time,
        date: e.date
      }, { merge: true });
    });

    if(state.pendingDeletes.length){
      state.pendingDeletes.forEach(id => {
        const ref = db.collection('users').doc(uid).collection('events').doc(id);
        batch.delete(ref);
      });
    }

    await batch.commit();

    unsyncedActs.forEach(a => a.synced = true);
    unsyncedEvs.forEach(e => e.synced = true);
    state.pendingDeletes = [];

    persistActivities();
    persistEvents();
    persistDeletes();
  } catch(err) {
    console.error('Firebase sync push failed', err);
  }
  setSyncBusy(false);
}

async function syncPull(){
  if(!CLOUD_ENABLED || !state.user) return;
  setSyncBusy(true);
  try {
    const uid = state.user.uid;
    const [actsSnap, evsSnap] = await Promise.all([
      db.collection('users').doc(uid).collection('activities').get(),
      db.collection('users').doc(uid).collection('events').get()
    ]);

    if(!actsSnap.empty){
      const remoteActs = actsSnap.docs.map(doc => doc.data());
      mergeActivities(remoteActs);
    }
    if(!evsSnap.empty){
      const remoteEvs = evsSnap.docs.map(doc => doc.data());
      mergeEvents(remoteEvs);
    }

    persistActivities();
    persistEvents();
  } catch(err) {
    console.error('Firebase sync pull failed', err);
  }
  setSyncBusy(false);
}

function mergeActivities(remoteRows){
  const byId = new Map(state.activities.map(a=>[a.id, a]));
  remoteRows.forEach(r=>{
    const local = byId.get(r.id);
    if(!local){
      byId.set(r.id, { id:r.id, name:r.name, category:r.category, color:r.color, instant:!!r.instant, is_pinned:r.is_pinned, synced:true, updated_at:r.updated_at });
    } else if(local.synced){
      Object.assign(local, { name:r.name, category:r.category, color:r.color, instant:!!r.instant, is_pinned:r.is_pinned, synced:true, updated_at:r.updated_at });
    }
  });
  state.activities = Array.from(byId.values());
}

function mergeEvents(remoteRows){
  const pendingSet = new Set(state.pendingDeletes);
  const byId = new Map(state.events.map(e=>[e.id, e]));
  remoteRows.forEach(r=>{
    if(pendingSet.has(r.id)) return;
    const local = byId.get(r.id);
    if(!local){
      byId.set(r.id, { id:r.id, client_id:r.client_id||r.id, activity_id:r.activity_id, activity_name:r.activity_name, category:r.category, color:r.color, instant:!!r.instant, start_time:r.start_time, date:r.date, synced:true });
    } else if(local.synced){
      Object.assign(local, { activity_name:r.activity_name, category:r.category, color:r.color, instant:!!r.instant, start_time:r.start_time, date:r.date, synced:true });
    }
  });
  state.events = Array.from(byId.values()).sort((a,b)=> new Date(a.start_time)-new Date(b.start_time));
}

/* ============================= INIT ============================= */
renderAuthUI();
renderAll();

})();
</script>
